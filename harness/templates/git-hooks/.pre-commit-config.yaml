# Harness Template: pre-commit hooks para projetos Python
# Instalação: pip install pre-commit && pre-commit install --install-hooks
# Uso manual: pre-commit run --all-files

repos:
  # Ruff: linter + formatter ultra-rápido (substitui flake8 + isort + black)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Mypy: type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        args: [--strict]

  # Commitizen: validação de mensagem de commit (Conventional Commits)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.21.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Checks gerais
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=500']
