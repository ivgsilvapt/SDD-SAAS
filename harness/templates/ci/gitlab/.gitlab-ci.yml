# Harness Template: GitLab CI/CD
# Placeholders: {{NODE_VERSION}}, {{APP_NAME}}
# Equivalente ao pipeline github/ci.yml + cd-staging.yml + security.yml

stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  POSTGRES_DB: testdb
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

.node-base:
  image: node:{{NODE_VERSION}}-alpine
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/

lint:
  extends: .node-base
  stage: lint
  script:
    - npm ci
    - npm run lint
    - npm run typecheck

test-unit:
  extends: .node-base
  stage: test
  script:
    - npm ci
    - npm run test:unit

test-integration:
  extends: .node-base
  stage: test
  services:
    - postgres:16-alpine
    - redis:7-alpine
  variables:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/testdb
    REDIS_URL: redis://redis:6379
  script:
    - npm ci
    - npm run test:integration

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t $DOCKER_IMAGE .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $DOCKER_IMAGE
  only:
    - main
    - tags

deploy-staging:
  stage: deploy
  environment:
    name: staging
  script:
    - echo "Deploy {{APP_NAME}} $CI_COMMIT_SHA to staging"
  only:
    - main

deploy-production:
  stage: deploy
  environment:
    name: production
  when: manual
  script:
    - echo "Deploy {{APP_NAME}} $CI_COMMIT_TAG to production"
  only:
    - tags

security-scan:
  stage: test
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL .
  allow_failure: true
  only:
    - schedules
    - main
