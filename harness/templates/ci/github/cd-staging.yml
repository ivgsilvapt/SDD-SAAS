      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: ${{ secrets.AWS_REGION }}
      # - name: Login to ECR
      #   uses: aws-actions/amazon-ecr-login@v2
      # - name: Push to ECR and deploy ECS
      #   run: |
      #     docker push ${{ secrets.ECR_REGISTRY }}/{{APP_NAME}}:${{ github.sha }}
      #     aws ecs update-service --cluster staging --service {{APP_NAME}} --force-new-deployment

      # ── Fly.io ───────────────────────────────────────────────────────────
      # Descomentar se CLOUD_PROVIDER=fly
