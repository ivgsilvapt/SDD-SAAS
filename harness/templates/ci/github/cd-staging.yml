# Harness Template: CD Staging — deploy automático em push para main
# Placeholders: {{APP_NAME}}, {{CLOUD_PROVIDER}}
# Requer secrets: CLOUD_CREDENTIALS (configura conforme cloud provider)

name: CD Staging

on:
  push:
    branches: [main]

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    concurrency: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag {{APP_NAME}}:${{ github.sha }} \
            --tag {{APP_NAME}}:staging \
            .

      # ── AWS ECS ──────────────────────────────────────────────────────────
