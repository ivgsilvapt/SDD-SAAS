# Harness Template: docker-compose para ambiente de desenvolvimento
# Placeholders: {{APP_NAME}}, {{DB_NAME}}, {{PORT}}
# Uso: copiar para raiz do projeto e substituir placeholders

services:
  app:
    build:
      context: .
      target: builder
    container_name: {{APP_NAME}}-app
    ports:
      - "{{PORT}}:{{PORT}}"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/{{DB_NAME}}
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: npm run dev

  db:
    image: postgres:16-alpine
    container_name: {{APP_NAME}}-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: {{DB_NAME}}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: {{APP_NAME}}-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
