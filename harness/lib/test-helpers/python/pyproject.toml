[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-test-helpers"
version = "2.1.0"
description = "Test helpers reutilizáveis para projetos SDD-SAAS: InMemoryRepository, TenantBuilder, FakeMailer"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.11"
