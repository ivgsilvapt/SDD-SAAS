[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-observability"
version = "2.1.0"
description = "Observabilidade pré-configurada: logger (structlog), metrics (prometheus_client), correlation (contextvars), health endpoints (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "structlog>=24.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110", "starlette>=0.37"]
opentelemetry = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.11"
