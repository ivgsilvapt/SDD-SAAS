[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-saas-core"
version = "2.0.1"
description = "Primitivas multi-tenant: TenantId, TenantAwareEntity, TenantContext, TenantAwareRepository, tenant middleware"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.110", "starlette>=0.37"]
django = ["django>=4.2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.11"
